rules:
  - id: wm-client-ip-trust
    message: "Potential rate-limit bypass: Direct trust of client-supplied 'cf-connecting-ip' or 'x-forwarded-for' without edge proof verification."
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-290: Authentication Bypass by Spoofing"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
    patterns:
      - pattern-either:
          - pattern: $REQ.headers.get('cf-connecting-ip')
          - pattern: $REQ.headers.get('x-forwarded-for')
      - pattern-not-inside: |
          if (hasCloudflareTransitProof(...)) { ... }
      - pattern-not-inside: |
          if ($PROOF && ...) { ... }

  - id: wm-cors-wildcard-credentials
    message: "Insecure CORS configuration: Access-Control-Allow-Origin wildcard (*) used with Access-Control-Allow-Credentials: true."
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      category: security
    patterns:
      - pattern: |
          {
            ...,
            'Access-Control-Allow-Origin': '*',
            ...,
            'Access-Control-Allow-Credentials': 'true',
            ...
          }

  - id: wm-innerhtml-untrusted-sink
    message: "Potential Cross-Site Scripting (XSS): Direct assignment to innerHTML without sanitization."
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      category: security
    patterns:
      - pattern: $EL.innerHTML = $INPUT
      - pattern-not: $EL.innerHTML = ""
      - pattern-not: $EL.innerHTML = ''

  - id: wm-ssrf-unvalidated-fetch
    message: "Potential Server-Side Request Forgery (SSRF): Outbound fetch with unvalidated URL."
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      category: security
    patterns:
      - pattern: fetch($URL, ...)
      - pattern-not-inside: |
          if (!isAllowedDomain(...)) { ... }
          ...
      - pattern-not-inside: |
          if (isAllowedDomain(...)) { ... }
