# Isolated Docker Compose target environment for World Monitor
# Runs strictly on loopback (127.0.0.1) with synthetic credentials
version: "3.8"

networks:
  wmsa_isolated:
    driver: bridge

services:
  worldmonitor:
    build:
      context: ../target
      dockerfile: Dockerfile
    image: worldmonitor-target:pinned
    container_name: wmsa_target
    restart: "no"
    networks:
      - wmsa_isolated
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      NODE_ENV: "production"
      PORT: "8080"
      UPSTASH_REDIS_REST_URL: "http://redis-mock:80"
      UPSTASH_REDIS_REST_TOKEN: "dummy_synthetic_redis_token_wmsa_12345"
      WM_SESSION_SECRET: "dummy_synthetic_session_secret_wmsa_67890"
      RELAY_SHARED_SECRET: "dummy_synthetic_relay_secret_wmsa_abcde"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WM_TRUSTED_PROXY_CIDRS: "127.0.0.1/32"
    depends_on:
      - redis-mock

  redis-mock:
    image: redis:7-alpine
    container_name: wmsa_redis
    restart: "no"
    networks:
      - wmsa_isolated
    command: ["redis-server", "--protected-mode", "yes"]
